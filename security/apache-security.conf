# Requer mod_headers; use somente em HTTPS após validar o domínio final.
Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-src https://www.google.com https://www.google.com.br; connect-src 'self'; upgrade-insecure-requests"
Header always set X-Frame-Options "DENY"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
<FilesMatch "\.(css|js|svg|jpg|jpeg|png|webp)$"><IfModule mod_headers.c>Header set Cache-Control "public, max-age=2592000, immutable"</IfModule></FilesMatch>
